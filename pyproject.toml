[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gobierno-ia"
version = "0.1.0"
description = "Parches versionados para simplificación legislativa"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gobierno-ia = "gobierno_ia.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
